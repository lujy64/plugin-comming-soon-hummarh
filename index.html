<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hummarh - Coming Soon</title>
    <link rel="stylesheet" href="assets/css/hummarh-coming-soon.css">
    <style>
        .hcs-credit {
            margin: 0;
            padding: 10px 20px 18px;
            color: rgba(239, 239, 239, .72);
            font-size: 11px;
            line-height: 1.2;
            letter-spacing: .08em;
            text-align: center;
            text-transform: uppercase;
        }

        @media (max-width: 760px) {
            .hcs-credit {
                padding: 12px 14px 18px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body class="hcs-body">
    <main class="hcs-coming-soon hcs-coming-soon--full">
        <section class="hcs-stage" aria-label="Hummarh - Coming Soon">
            <div class="hcs-copy">
                <div class="hcs-topline">
                    <span class="hcs-eyebrow">COMING SOON</span>
                    <a class="hcs-button hcs-button--outline hcs-button--wide" href="https://www.linkedin.com/" target="_blank" rel="noopener">LINKEDIN</a>
                </div>

                <div class="hcs-brand-block">
                    <img class="hcs-badge-logo" src="assets/images/logo-circular.png" alt="">
                    <img class="hcs-wordmark hcs-wordmark--desktop" src="assets/images/logo-texto.png?v=2" alt="Hummarh">
                    <img class="hcs-wordmark hcs-wordmark--mobile" src="assets/images/logo-texto-mobile.png?v=1" alt="Hummarh">

                    <div class="hcs-bottom-row">
                        <p class="hcs-tagline">Gestion de Personas y<br>Desarrollo Organizacional.</p>
                        <div class="hcs-actions" aria-label="Contact links">
                            <a class="hcs-button hcs-button--light hcs-button--compact" href="tel:+5492975371203">+54 9 2975 371203</a>
                            <a class="hcs-button hcs-button--light hcs-button--compact" href="mailto:info@hummarh.com">MAIL</a>
                        </div>
                    </div>
                </div>
            </div>

            <aside class="hcs-visual" aria-label="Hummarh gallery and contact">
                <div class="hcs-carousel" data-hcs-carousel>
                    <div class="hcs-carousel__track">
                        <figure class="hcs-carousel__slide">
                            <img src="assets/images/carousel-1.png" alt="Carousel image 1">
                        </figure>
                        <figure class="hcs-carousel__slide">
                            <img src="assets/images/carousel-2.png" alt="Carousel image 2">
                        </figure>
                        <figure class="hcs-carousel__slide">
                            <img src="assets/images/carousel-3.png" alt="Carousel image 3">
                        </figure>
                    </div>
                </div>
            </aside>
        </section>
        <p class="hcs-credit">Hecho por The Panther Soft - Vaira Maria Lujan</p>
    </main>
    <script src="assets/js/hummarh-coming-soon.js"></script>
</body>
</html>
